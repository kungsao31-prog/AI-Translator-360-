
name: Build AI Translator 360 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: false

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android files
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/aitranslator360/app

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/aitranslator360/app/MainActivity.java
          cp index.html app/src/main/assets/index.html

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.aitranslator360.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.aitranslator360.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0.0'
              }
          }
          EOF

      - name: Configure Gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AI-Translator-360'
          include ':app'
          EOF

          echo "plugins { id 'com.android.application' version '8.6.1' apply false }" > build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Translator-360-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          
